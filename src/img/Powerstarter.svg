<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Powerstarter</title>
  <desc id="desc">Powerstarter logo with a clean tree-and-rocket style mark and wordmark.</desc>
  <defs>
    <linearGradient id="ps-gradient" x1="12" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26D07C" />
      <stop offset="0.5" stop-color="#2FB5FF" />
      <stop offset="1" stop-color="#0F6CFF" />
    </linearGradient>
    <linearGradient id="ps-surface" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EAF3FF" />
    </linearGradient>
    <filter id="ps-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>
  <g filter="url(#ps-shadow)">
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#ps-surface)" stroke="#D9E6F7" />
    <circle cx="60" cy="60" r="28" fill="#F5FAFF" stroke="#DCE8F6" />
    <path d="M60 88V44" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M60 44L48 54" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 44L72 54" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 54L38 66" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 54L82 66" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 66L48 78" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 66L72 78" stroke="url(#ps-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="42" r="8" fill="url(#ps-gradient)" />
    <circle cx="46" cy="55" r="4" fill="#26D07C" />
    <circle cx="74" cy="55" r="4" fill="#2FB5FF" />
    <circle cx="40" cy="68" r="4" fill="#26D07C" />
    <circle cx="80" cy="68" r="4" fill="#0F6CFF" />
    <circle cx="50" cy="82" r="4" fill="#2FB5FF" />
    <circle cx="70" cy="82" r="4" fill="#26D07C" />
  </g>
  <g transform="translate(136 30)">
    <text x="0" y="30" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.03em">Powerstarter</text>
    <text x="2" y="58" fill="#5B6B82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.02em">Hub for smart apps, game feeds, and project evolution</text>
